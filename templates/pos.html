{% extends "base.html" %}
{% block title %}Point of Sale{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Point of Sale</h1>
    <p>Search products, build a cart, and complete the sale.</p>
  </div>
</header>

<div class="pos-layout">
  <section class="card pos-products">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search product by name or code..." />
    <div class="product-grid" id="productGrid"></div>
  </section>

  <section class="card pos-cart">
    <h2>Current Cart</h2>
    <div id="cartItems" class="cart-items">
      <div class="empty">Cart is empty. Add products to get started.</div>
    </div>

    <div class="cart-totals">
      <div class="row"><span>Total</span><strong id="cartTotal">₱0.00</strong></div>
    </div>

    <label>Amount Paid (₱)</label>
    <input type="number" id="paymentInput" step="0.01" min="0" placeholder="0.00" />

    <div class="cart-totals">
      <div class="row"><span>Change</span><strong id="changeText">₱0.00</strong></div>
    </div>

    <button class="btn btn-primary full" id="checkoutBtn" disabled>Complete Sale</button>
  </section>
</div>

<!-- Receipt Modal -->
<div id="receiptModal" class="modal">
  <div class="modal-content receipt-modal">
    <div id="receiptContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-primary" onclick="closeModal('receiptModal'); location.reload()">Done</button>
    </div>
  </div>
</div>

<script>
window.CART = {};
window.PRODUCTS = [];
</script>
{% endblock %}
